services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: ${DB_DATABASE:?Isi DB_DATABASE di file .env}
      MARIADB_USER: ${DB_USERNAME:?Isi DB_USERNAME di file .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
    volumes:
      - rsbilling-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  app:
    image: ${COMPOSE_PROJECT_NAME:-rsbilling}-app:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    volumes:
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./public:/var/www/html/public:ro
      - ./scripts:/var/www/html/scripts:ro
    networks:
      - backend

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks:
      - backend

  network-worker:
    image: ${COMPOSE_PROJECT_NAME:-rsbilling}-app:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      RSBILLING_SKIP_INSTALL: "1"
      NETWORK_WORKER_ID: primary
    depends_on:
      web:
        condition: service_healthy
    command: ["php", "/var/www/html/scripts/network_worker_daemon.php"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    stop_grace_period: 20s
    volumes:
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./scripts:/var/www/html/scripts:ro
    healthcheck:
      test: ["CMD", "php", "/var/www/html/scripts/network_worker_health.php"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend

volumes:
  rsbilling-db:

networks:
  backend:
    driver: bridge
